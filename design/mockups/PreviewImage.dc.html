<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
  <style>
* { box-sizing: border-box; }
body { margin: 0; background: #F6F5F1; }
.app {
  font-family: 'Geist', -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  --bg: #F6F5F1; --surface: #FFFFFF; --surface-2: #EFEEE9;
  --border: #E6E4DE; --border-2: #D8D5CD;
  --text: #1B1A17; --text-2: #6E6A62; --text-3: #9B978E;
  --primary: #171614; --on-primary: #FFFFFF;
  --accent: #2E64C8; --accent-soft: #E4ECFA; --accent-text: #1F4F9E;
  --ok: #3B7A45; --ok-soft: #E6F1E7;
  --warn: #956400; --warn-soft: #FBF3DB;
  --danger: #B3362F; --danger-soft: #FBE9E7; --on-danger: #FFFFFF;
  --folder-a: #DCE7F8; --folder-b: #C6D8F4; --folder-line: #3F6BB8;
  --seg-1: #9DB9EA; --seg-2: #9FCBA6; --seg-3: #E8CD82; --seg-4: #C9C6BE;
  --shadow: 0 8px 24px rgba(27, 26, 23, 0.08);
}
.app[data-theme="dark"] {
  --bg: #151412; --surface: #1C1B18; --surface-2: #252420;
  --border: #2C2B26; --border-2: #3A3832;
  --text: #ECEAE4; --text-2: #A19D94; --text-3: #726F67;
  --primary: #ECEAE4; --on-primary: #151412;
  --accent: #6F9BE8; --accent-soft: #1F2E4A; --accent-text: #A9C4F2;
  --ok: #7FC48A; --ok-soft: #1D3122;
  --warn: #E0B25A; --warn-soft: #382E16;
  --danger: #E27A72; --danger-soft: #3A201E; --on-danger: #1A0F0E;
  --folder-a: #25355A; --folder-b: #2F457A; --folder-line: #7FA3E6;
  --seg-1: #4F76BF; --seg-2: #4E8C5A; --seg-3: #A88A3A; --seg-4: #5A5850;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.mono { font-family: 'Geist Mono', 'SF Mono', Menlo, monospace; font-variant-numeric: tabular-nums; }
.ico { display: inline-flex; flex: none; }
.ico svg { display: block; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
kbd { font-family: 'Geist Mono', 'SF Mono', Menlo, monospace; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: var(--surface-2); color: var(--text-3); }
</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="width:1280px;height:800px;overflow:hidden;background:var(--bg);color:var(--text);display:flex;flex-direction:column;">
<header style="height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px 0 84px;border-bottom:1px solid var(--border);background:var(--surface)">
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
    <div class="trunc" style="font-weight:500">store-front.jpg</div>
    <div class="trunc" style="font-size:12px;color:var(--text-3)">/Product Photos · JPEG image · 4032 × 3024 · 3.4 MB</div>
  </div>
  <button type="button" style="height:32px;padding:0 12px;border-radius:6px;font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;cursor:default;background:var(--surface);color:var(--text);border:1px solid var(--border-2);"><span class="ico" style="width:15px;height:15px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 19.5h16"/></svg></span><span>Download</span></button>
  <div style="display:flex;align-items:center;gap:6px"><kbd>Esc</kbd><button type="button" style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;padding:0;font:inherit;cursor:default;border:1px solid transparent;background:transparent;color:var(--text-2);"><span class="ico" style="width:16px;height:16px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button></div>
</header>
<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px"><div style="width:1000px;height:100%;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-3)"><span class="ico" style="width:44px;height:44px;opacity:0.6"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="13" rx="1.5"/><path d="M4 16l4.5-4.5 3.5 3.5 3-3 5 5"/><circle cx="15.5" cy="9.5" r="1.2" fill="currentColor" stroke="none"/></svg></span></div></div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark;
    if (dark === undefined || dark === null) dark = false;
    return { theme: dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
